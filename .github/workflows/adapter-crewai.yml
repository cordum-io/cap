name: Adapter CrewAI

# Locked install and the CrewAI adapter tests, including the child lifecycle on each OS, under the test-only network trap; read-only, uses no secrets or caches.

on:
  push:
    branches: [ main ]
    paths:
      - 'adapters/crewai/**'
      - 'sdk/python/**'
      - 'testdata/adapters/**'
      - '.github/workflows/adapter-crewai.yml'
  pull_request:
    paths:
      - 'adapters/crewai/**'
      - 'sdk/python/**'
      - 'testdata/adapters/**'
      - '.github/workflows/adapter-crewai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    name: CrewAI adapter (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - { os: macos-latest, python-version: '3.10' }
          - { os: macos-latest, python-version: '3.13' }
          - { os: windows-latest, python-version: '3.10' }
          - { os: windows-latest, python-version: '3.13' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked dependencies
        run: python -m pip install --require-hashes --no-deps -r adapters/crewai/requirements.lock
      - name: Build and install both wheels
        run: |
          python -m build --no-isolation --wheel --outdir dist sdk/python
          python -m build --no-isolation --wheel --outdir dist adapters/crewai
          python -m pip install --no-index --no-deps dist/*.whl
          python -m pip check
      - name: Adapter tests under the network trap
        run: PYTHONPATH="$GITHUB_WORKSPACE/testdata/adapters/nettrap" python -m pytest -q -rs -p no:cacheprovider adapters/crewai/tests

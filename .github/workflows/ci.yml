name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Generate conformance fixtures
        run: |
          go run tools/conformance/generate_fixtures.go
          git diff --exit-code spec/conformance/fixtures

      - name: Go test
        run: go test ./...

      - name: Go race (SDK)
        run: go test -race ./sdk/go/...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  node:
    name: Node SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json

      - name: Install dependencies
        working-directory: sdk/node
        run: npm ci

      - name: Run tests
        working-directory: sdk/node
        run: npm test

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e sdk/python

      - name: Run tests
        run: python -m unittest discover -s sdk/python/tests

  python-guard:
    name: Python Guard SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "sdk/python-guard[dev]"

      - name: Run tests
        working-directory: sdk/python-guard
        run: pytest

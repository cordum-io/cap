name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Generate conformance fixtures
        run: |
          go run tools/conformance/generate_fixtures.go
          git diff --exit-code spec/conformance/fixtures

      - name: Go test
        run: go test ./...

      - name: Go race (SDK)
        run: go test -race ./sdk/go/...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  node:
    name: Node SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json

      - name: Install dependencies
        working-directory: sdk/node
        run: npm ci

      - name: Run source tests
        working-directory: sdk/node
        run: npm test

      - name: Build package
        working-directory: sdk/node
        run: npm run build

      - name: Verify installed package
        working-directory: sdk/node
        run: npm run test:package

      - name: Lint package metadata
        working-directory: sdk/node
        run: npm run lint:package

      - name: Audit production dependencies
        working-directory: sdk/node
        run: npm audit --omit=dev --audit-level=high

  node-nats:
    name: Node SDK (real NATS v2.10.25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json

      - name: Install dependencies
        working-directory: sdk/node
        run: npm ci

      - name: Pull pinned NATS server
        run: docker pull nats:2.10.25-alpine

      - name: Run mandatory real-NATS restart test
        working-directory: sdk/node
        run: npm run test:nats

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e sdk/python pytest

      - name: Run tests
        run: python -m unittest discover -s sdk/python/tests

  python-guard:
    name: Python Guard SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "sdk/python-guard[dev]"

      - name: Run tests
        working-directory: sdk/python-guard
        run: pytest

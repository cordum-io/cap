name: Interop Contract

# Validates asyncapi/cap.asyncapi.yaml against spec/09, spec/14, the proto files and
# the Go SDK subject constants, and checks the spec/interop vectors. Read-only, no
# secrets, no caches. Installs only from tools/interop/package-lock.json, and
# tools/interop/.npmrc disables install scripts.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: AsyncAPI contract and interop vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install pinned validator dependencies
        run: npm ci --prefix tools/interop
      - name: Validate AsyncAPI contract and interop vectors
        run: node tools/interop/validate.cjs

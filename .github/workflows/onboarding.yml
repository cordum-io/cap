name: Installed-artifact onboarding
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  contracts:
    name: Cross-platform tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify deterministic tooling and documentation bytes
        run: |
          python -m unittest tools.onboarding.test_build_go_proxy tools.onboarding.test_sync_snippets
          python tools/onboarding/sync_snippets.py --check
  smoke:
    if: ${{ always() && needs.contracts.result == 'success' }}
    name: ${{ matrix.language }} exact snippets on NATS 2.12.6
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, node]
    env:
      CAP_NATS_URL: nats://127.0.0.1:4222
      NATS_IMAGE: >-
        nats:2.12.6-alpine@sha256:1cfc36e2e5e638243d8c722f72c954cd0ec4b15ee82fadbc718ce12e2b3c1652
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python for deterministic tooling
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.12"
      - name: Set up Node
        if: matrix.language == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - name: Verify tooling and exact documentation bytes
        run: |
          python -m unittest \
            tools.onboarding.test_build_go_proxy \
            tools.onboarding.test_sync_snippets \
            tools.onboarding.test_workflow_contract
          python tools/onboarding/sync_snippets.py --check
      - name: Prepare isolated paths and timing evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cap-onboarding-logs-${{ matrix.language }}"
          echo "language=${{ matrix.language }} sha=$GITHUB_SHA" > "$RUNNER_TEMP/cap-onboarding-logs-${{ matrix.language }}/gate-context.log"
          echo "START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build and install Go candidate in an empty consumer
        if: matrix.language == 'go'
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/cap-onboarding-consumer-go"
          proxy="$RUNNER_TEMP/cap-onboarding-go-proxy"
          version="v2.5.3-onboarding.0.g${GITHUB_SHA:0:12}"
          rm -rf "$consumer" "$proxy"
          python tools/onboarding/build_go_proxy.py \
            --output "$proxy" --version "$version"
          mkdir -p "$consumer/worker" "$consumer/client" "$consumer/.gomodcache"
          cp examples/simple-echo/go-worker/main.go "$consumer/worker/main.go"
          cp examples/simple-echo/go-client/main.go "$consumer/client/main.go"
          proxy_url="$(python -c \
            'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())' \
            "$proxy")"
          cd "$consumer"
          go mod init example.com/cap-first-go
          env GOWORK=off GOMODCACHE="$consumer/.gomodcache" \
            GOPROXY="$proxy_url" GONOSUMDB=github.com/cordum-io/cap/v2 \
            go mod download -json "github.com/cordum-io/cap/v2@$version" >cap-download.json
          python -c 'import hashlib,json,sys; d=json.load(open(sys.argv[1])); h=lambda p: hashlib.sha256(open(p,"rb").read()).digest(); raise SystemExit(0 if h(d["Zip"]) == h(sys.argv[2]) else 1)' cap-download.json "$proxy/github.com/cordum-io/cap/v2/@v/$version.zip"
          env GOWORK=off GOMODCACHE="$consumer/.gomodcache" \
            GOPROXY="$proxy_url,https://proxy.golang.org,direct" \
            GONOSUMDB=github.com/cordum-io/cap/v2 \
            go get "github.com/cordum-io/cap/v2@$version"
          env GOWORK=off GOMODCACHE="$consumer/.gomodcache" \
            GOPROXY="$proxy_url,https://proxy.golang.org,direct" \
            GONOSUMDB=github.com/cordum-io/cap/v2 go mod tidy
          env GOWORK=off GOMODCACHE="$consumer/.gomodcache" \
            GOPROXY="$proxy_url,https://proxy.golang.org,direct" \
            GONOSUMDB=github.com/cordum-io/cap/v2 go mod vendor
          resolved="$(env GOWORK=off GOMODCACHE="$consumer/.gomodcache" \
            GOPROXY="$proxy_url,https://proxy.golang.org,direct" \
            GONOSUMDB=github.com/cordum-io/cap/v2 \
            go list -m -f '{{.Version}}|{{if .Replace}}{{.Replace.Path}}{{end}}' \
            github.com/cordum-io/cap/v2)"
          test "$resolved" = "$version|"
          GOWORK=off GOPROXY=off go build -mod=vendor -o worker-bin ./worker
          GOWORK=off GOPROXY=off go build -mod=vendor -o client-bin ./client
          echo "CONSUMER_DIR=$consumer" >> "$GITHUB_ENV"

      - name: Build and install Python candidate in an empty consumer
        if: matrix.language == 'python'
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/cap-onboarding-consumer-python"
          dist="$RUNNER_TEMP/cap-onboarding-python-dist"
          rm -rf "$consumer" "$dist"
          mkdir -p "$consumer/worker" "$consumer/client" "$dist"
          python -m pip install "build>=1.2,<2" "twine>=5,<7"
          python -m build --outdir "$dist" sdk/python
          mapfile -t wheels < <(compgen -G "$dist/*.whl")
          mapfile -t sdists < <(compgen -G "$dist/*.tar.gz")
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          python -m twine check "${wheels[0]}" "${sdists[0]}"
          python -m venv "$consumer/.venv"
          py="$consumer/.venv/bin/python"
          "$py" -m pip install --no-cache-dir "${wheels[0]}"
          "$py" -m pip check
          installed="$(env -u PYTHONPATH "$py" -I -c \
            'import cap; print(cap.__file__)')"
          case "$installed" in "$consumer"/.venv/*) ;; *) exit 1 ;; esac
          cp examples/simple-echo/python-worker/main.py "$consumer/worker/main.py"
          cp examples/simple-echo/python-client/main.py "$consumer/client/main.py"
          echo "CONSUMER_DIR=$consumer" >> "$GITHUB_ENV"

      - name: Build and install Node candidate in an empty consumer
        if: matrix.language == 'node'
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/cap-onboarding-consumer-node"
          dist="$RUNNER_TEMP/cap-onboarding-node-dist"
          rm -rf "$consumer" "$dist"
          mkdir -p "$consumer/worker" "$consumer/client" "$dist"
          (cd sdk/node && npm ci && npm run build && \
            npm pack --json --pack-destination "$dist" >"$dist/pack.json")
          mapfile -t tarballs < <(compgen -G "$dist/*.tgz")
          test "${#tarballs[@]}" -eq 1
          node sdk/node/scripts/verify-package.cjs \
            --tarball "${tarballs[0]}" --pack-json "$dist/pack.json"
          cd "$consumer"
          npm init -y >/dev/null
          env -u NODE_PATH -u NODE_OPTIONS npm install \
            --ignore-scripts --no-audit --no-fund "${tarballs[0]}"
          env -u NODE_PATH -u NODE_OPTIONS npm ls --omit=dev
          installed="$(env -u NODE_PATH -u NODE_OPTIONS node -e \
            'process.stdout.write(require.resolve("cap-sdk-node"))')"
          case "$installed" in "$consumer"/node_modules/*) ;; *) exit 1 ;; esac
          cp "$GITHUB_WORKSPACE/examples/simple-echo/node-worker/main.js" worker/main.js
          cp "$GITHUB_WORKSPACE/examples/simple-echo/node-client/main.js" client/main.js
          echo "CONSUMER_DIR=$consumer" >> "$GITHUB_ENV"

      - name: Run negative and successful exact-snippet smoke
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/cap-onboarding-logs-$LANGUAGE"
          nats_name="cap-onboarding-nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          worker_pid=""
          mkdir -p "$logs"

          cleanup() {
            bash tools/onboarding/cleanup_runtime.sh "$logs" "$nats_name"
            if [[ -n "$worker_pid" ]]; then wait "$worker_pid" 2>/dev/null || true; fi
          }
          on_exit() {
            status=$?
            trap - EXIT INT TERM
            cleanup
            exit "$status"
          }
          on_signal() {
            trap - EXIT INT TERM
            cleanup
            exit 130
          }
          trap on_exit EXIT
          trap on_signal INT TERM

          run_client() {
            local -a command
            case "$LANGUAGE" in
              go) command=(env CAP_NATS_URL="$CAP_NATS_URL" \
                CAP_RESULT_TIMEOUT_SECONDS="$1" "$CONSUMER_DIR/client-bin") ;;
              python) command=(env -u PYTHONPATH CAP_NATS_URL="$CAP_NATS_URL" \
                CAP_RESULT_TIMEOUT_SECONDS="$1" "$CONSUMER_DIR/.venv/bin/python" \
                -I "$CONSUMER_DIR/client/main.py") ;;
              node) command=(env -u NODE_PATH -u NODE_OPTIONS \
                CAP_NATS_URL="$CAP_NATS_URL" CAP_RESULT_TIMEOUT_SECONDS="$1" \
                node "$CONSUMER_DIR/client/main.js") ;;
            esac
            timeout "$2" "${command[@]}"
          }
          run_worker() {
            case "$LANGUAGE" in
              go) exec env CAP_NATS_URL="$CAP_NATS_URL" \
                "$CONSUMER_DIR/worker-bin" ;;
              python) exec env -u PYTHONPATH CAP_NATS_URL="$CAP_NATS_URL" \
                "$CONSUMER_DIR/.venv/bin/python" -I "$CONSUMER_DIR/worker/main.py" ;;
              node) exec env -u NODE_PATH -u NODE_OPTIONS \
                CAP_NATS_URL="$CAP_NATS_URL" node "$CONSUMER_DIR/worker/main.js" ;;
            esac
          }

          docker pull "$NATS_IMAGE"
          docker run -d --rm --name "$nats_name" \
            -p 127.0.0.1:4222:4222 -p 127.0.0.1:8222:8222 \
            "$NATS_IMAGE" -m 8222
          broker_ready=false
          for attempt in {1..50}; do
            if curl --connect-timeout 1 --max-time 1 -fsS \
              http://127.0.0.1:8222/healthz >"$logs/healthz"; then
              if python -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1], encoding="utf-8")).get("status") == "ok" else 1)' "$logs/healthz"; then
                broker_ready=true
                break
              fi
            fi
            sleep 0.2
          done
          test "$broker_ready" = true

          set +e
          run_client 1 20s >"$logs/no-worker.log" 2>&1
          no_worker_status=$?
          set -e
          test "$no_worker_status" -ne 0
          test "$no_worker_status" -lt 124
          grep -Eqi "timed out|timeout" "$logs/no-worker.log"
          ! grep -q "CAP_SIMPLE_ECHO_SUCCESS" "$logs/no-worker.log"

          run_worker >"$logs/worker.log" 2>&1 &
          worker_pid=$!
          echo "$worker_pid" > "$logs/worker.pid"
          worker_ready=false
          for attempt in {1..50}; do
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            if curl --connect-timeout 1 --max-time 1 -fsS \
              "http://127.0.0.1:8222/subsz?subs=1" >"$logs/subsz.json"; then
              if python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); raise SystemExit(0 if any(entry.get("subject") == "job.echo" for entry in data.get("subscriptions_list", [])) else 1)' "$logs/subsz.json"; then
                worker_ready=true
                break
              fi
            fi
            sleep 0.2
          done
          test "$worker_ready" = true
          run_client 15 30s >"$logs/client.log" 2>&1
          set +e
          success_count="$(grep -c "^CAP_SIMPLE_ECHO_SUCCESS" "$logs/client.log")"
          marker_status=$?
          set -e
          test "$marker_status" -eq 0
          test "$success_count" -eq 1
          elapsed_seconds=$(( $(date +%s) - START_EPOCH ))
          test "$elapsed_seconds" -lt 600
          echo "$LANGUAGE onboarding: ${elapsed_seconds}s (<600s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Always capture onboarding state and clean up
        if: always()
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          logs="$RUNNER_TEMP/cap-onboarding-logs-$LANGUAGE"
          nats_name="cap-onboarding-nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$logs"
          if [[ -f tools/onboarding/cleanup_runtime.sh ]]; then
            bash tools/onboarding/cleanup_runtime.sh "$logs" "$nats_name"
          else
            printf '%s\n' 'checkout unavailable before cleanup' >"$logs/final-nats.log"
          fi

      - name: Archive onboarding diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onboarding-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cap-onboarding-logs-${{ matrix.language }}
          if-no-files-found: error
          retention-days: 7

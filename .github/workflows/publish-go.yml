name: Publish Go Module

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # Generated Go stubs (cordum/agent/v1/*.pb.go) are already tracked in
      # the repo and freshness-checked by the hermetic-codegen gate
      # (tools/make_protos.sh --check, run by .github/workflows/proto-codegen.yml
      # on every push to main) before this tag existed. Re-running the
      # multi-language hermetic generator here would need the same Node/
      # Python/Java/Rust/Ruby toolchain as that workflow for no added
      # confidence; just build and test the tracked Go output directly.
      - name: Go test (tracked generated stubs + SDK)
        run: |
          go test ./cordum/agent/v1/...
          go test ./...

      # Go modules are published via tags; no explicit publish step required.

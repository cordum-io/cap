name: Publish Node SDK to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to publish (e.g., 2.0.9)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sdk/node
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package.json matches the release tag
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # Fail closed: never rewrite source at publish time. The version must
          # already be synchronized by the approved release-prep commit that this
          # tag points at, so the published artifact is reproducible from source.
          if [[ -z "${VERSION}" ]]; then
            echo "VERSION not set from tag"; exit 1
          fi
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish: '${VERSION}' is not semver. Publish from a release tag, not a branch."; exit 1
          fi
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${CURRENT_VERSION}" != "${VERSION}" ]]; then
            echo "sdk/node/package.json version (${CURRENT_VERSION}) does not match the release tag (${VERSION})."
            echo "Land a release-prep commit that sets package.json + package-lock.json to ${VERSION}, then tag that commit."
            exit 1
          fi
          echo "package.json matches release tag ${VERSION}"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

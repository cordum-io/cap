name: Publish Node SDK to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to publish (e.g., 2.0.9)"
        required: true
        type: string

concurrency:
  group: publish-node-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NATS_IMAGE: >-
        nats:2.12.6-alpine@sha256:1cfc36e2e5e638243d8c722f72c954cd0ec4b15ee82fadbc718ce12e2b3c1652
    defaults:
      run:
        shell: bash
        working-directory: sdk/node
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json

      - name: Verify package.json matches the release tag
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          # Fail closed: never rewrite source at publish time. The version must
          # already be synchronized by the approved release-prep commit that this
          # tag points at, so the published artifact is reproducible from source.
          if [[ -z "${VERSION}" ]]; then
            echo "VERSION not set from tag"; exit 1
          fi
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish: '${VERSION}' is not semver. Publish from a release tag, not a branch."; exit 1
          fi
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${CURRENT_VERSION}" != "${VERSION}" ]]; then
            echo "sdk/node/package.json version (${CURRENT_VERSION}) does not match the release tag (${VERSION})."
            echo "Land a release-prep commit that sets package.json + package-lock.json to ${VERSION}, then tag that commit."
            exit 1
          fi
          echo "package.json matches release tag ${VERSION}"

      - name: Install locked dependencies
        run: npm ci

      - name: Run source tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Lint package metadata
        run: npm run lint:package

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install pinned NATS server binary
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/nats-server"
          docker pull "$NATS_IMAGE"
          cid="$(docker create "$NATS_IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1' EXIT
          docker cp "$cid:/usr/local/bin/nats-server" "$binary"
          docker rm "$cid" >/dev/null
          trap - EXIT
          chmod 0755 "$binary"
          test "$("$binary" -v)" = "nats-server: v2.12.6"
          echo "CAP_NATS_SERVER_BIN=$binary" >> "$GITHUB_ENV"

      - name: Run mandatory real-NATS restart test
        run: npm run test:nats

      - name: Pack release artifact exactly once
        id: pack
        env:
          CAP_NODE_PACK_DIR: ${{ runner.temp }}/cap-node-package
        run: |
          set -euo pipefail
          rm -rf -- "${CAP_NODE_PACK_DIR}"
          mkdir -p "${CAP_NODE_PACK_DIR}"
          PACK_JSON="${CAP_NODE_PACK_DIR}/pack.json"
          npm pack --json --pack-destination "${CAP_NODE_PACK_DIR}" > "${PACK_JSON}"
          TARBALL="$(node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const [jsonPath, packDir] = process.argv.slice(1);
            const entries = JSON.parse(fs.readFileSync(jsonPath, "utf8"));
            if (!Array.isArray(entries) || entries.length !== 1 || !entries[0].filename) process.exit(2);
            process.stdout.write(path.join(packDir, entries[0].filename));
          ' "${PACK_JSON}" "${CAP_NODE_PACK_DIR}")"
          test -f "${TARBALL}"
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"
          echo "pack_json=${PACK_JSON}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact release artifact
        run: >-
          node scripts/verify-package.cjs
          --tarball "${{ steps.pack.outputs.tarball }}"
          --pack-json "${{ steps.pack.outputs.pack_json }}"

      - name: Publish verified artifact to npm
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Clean release artifact
        if: always()
        env:
          CAP_NODE_PACK_DIR: ${{ runner.temp }}/cap-node-package
        run: rm -rf -- "${CAP_NODE_PACK_DIR}"

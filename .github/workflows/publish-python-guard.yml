name: Publish cordum-guard to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: sdk/python-guard

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build packaging

      - name: Verify pyproject matches the release tag
        env:
          VERSION: ${{ github.ref_name }}
          PYTHON_BIN: python
        run: |
          # Fail closed: never rewrite source at publish time. The version must
          # already be synchronized by the approved release-prep commit this tag
          # points at, so the published artifact is reproducible from source.
          if [[ -z "${VERSION}" ]]; then
            echo "VERSION not set from tag"; exit 1
          fi
          "$PYTHON_BIN" - <<'PY'
          import os, tomllib
          from pathlib import Path
          from packaging.version import InvalidVersion, Version

          raw = os.environ.get("VERSION", "").strip()
          candidate = raw[1:] if raw.startswith("v") else raw
          try:
              expected = Version(candidate)
          except InvalidVersion:
              raise SystemExit(
                  f"Refusing to publish: {raw!r} is not a PEP 440 version. "
                  "Publish from a release tag, not a branch."
              )
          data = tomllib.loads(Path("pyproject.toml").read_text())
          source = data.get("project", {}).get("version")
          if source is None:
              raise SystemExit("No [project].version in pyproject.toml")
          if Version(source) != expected:
              raise SystemExit(
                  f"pyproject version ({source}) does not match the release tag ({expected}). "
                  "Land a release-prep commit that sets pyproject.toml to the tag version, then tag it."
              )
          print(f"pyproject.toml matches release tag {expected}")
          PY
      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk/python-guard/dist
          skip-existing: true

name: Publish Python SDK to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: sdk/python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install build deps
        env:
          PYTHON_BIN: python
        run: |
          "$PYTHON_BIN" -m pip install --upgrade pip
          "$PYTHON_BIN" -m pip install build grpcio-tools packaging
          "$PYTHON_BIN" -m grpc_tools.protoc --version

      - name: Verify pyproject matches the release tag
        env:
          VERSION: ${{ github.ref_name }}
          PYTHON_BIN: python
        run: |
          # Fail closed: never rewrite source at publish time. The version must
          # already be synchronized by the approved release-prep commit this tag
          # points at, so the published artifact is reproducible from source.
          if [[ -z "${VERSION}" ]]; then
            echo "VERSION not set from tag"; exit 1
          fi
          "$PYTHON_BIN" - <<'PY'
          import os, tomllib
          from pathlib import Path
          from packaging.version import InvalidVersion, Version

          raw = os.environ.get("VERSION", "").strip()
          candidate = raw[1:] if raw.startswith("v") else raw
          try:
              expected = Version(candidate)
          except InvalidVersion:
              raise SystemExit(
                  f"Refusing to publish: {raw!r} is not a PEP 440 version. "
                  "Publish from a release tag, not a branch."
              )
          data = tomllib.loads(Path("pyproject.toml").read_text())
          source = data.get("project", {}).get("version")
          if source is None:
              raise SystemExit("No [project].version in pyproject.toml")
          if Version(source) != expected:
              raise SystemExit(
                  f"pyproject version ({source}) does not match the release tag ({expected}). "
                  "Land a release-prep commit that sets pyproject.toml to the tag version, then tag it."
              )
          print(f"pyproject.toml matches release tag {expected}")
          PY
      - name: Generate Python stubs
        env:
          PYTHON_BIN: python
        run: |
          mkdir -p cap/pb

          "$PYTHON_BIN" -m grpc_tools.protoc \
            -I../../proto \
            --python_out=./cap/pb \
            --grpc_python_out=./cap/pb \
            ../../proto/cordum/agent/v1/*.proto

          # grpc_tools.protoc does not generate __init__.py files;
          # create them so the pb package hierarchy is importable.
          touch cap/pb/__init__.py \
            cap/pb/cordum/__init__.py \
            cap/pb/cordum/agent/__init__.py \
            cap/pb/cordum/agent/v1/__init__.py

      - name: Build package
        env:
          PYTHON_BIN: python
        run: |
          "$PYTHON_BIN" -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: sdk/python/dist
          skip-existing: true

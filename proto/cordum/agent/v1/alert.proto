syntax = "proto3";

package cordum.agent.v1;

option go_package = "github.com/cordum-io/cap/v2/cordum/agent/v1";
option java_package = "io.cordum.cap.agent.v1";
option java_multiple_files = true;
option csharp_namespace = "Cordum.Agent.V1";
option php_namespace = "cordum\\Agent\\V1";
option ruby_package = "Cordum::Agent::V1";

import "cordum/agent/v1/job.proto";

// AlertSeverity represents the severity of a system alert.
enum AlertSeverity {
    ALERT_SEVERITY_UNSPECIFIED = 0;
    ALERT_SEVERITY_INFO = 1;
    ALERT_SEVERITY_WARNING = 2;
    ALERT_SEVERITY_ERROR = 3;
    ALERT_SEVERITY_CRITICAL = 4;
}

// SystemAlert is a lightweight signal for system-level issues.
message SystemAlert {
    string level = 1 [deprecated = true];   // Deprecated: use severity enum instead.
    string message = 2;                    // Human-readable detail of the alert.
    string component = 3 [deprecated = true]; // Deprecated: use source_component instead.
    string code = 4 [deprecated = true];   // Deprecated: use error_code_enum instead.
    AlertSeverity severity = 5;            // structured severity level
    ErrorCode error_code_enum = 6;         // structured error code from ErrorCode registry
    string source_component = 7;           // component ID that emitted the alert
    map<string, string> details = 8;       // structured key-value context
    string trace_id = 9;                   // optional correlation to a specific BusPacket
}

syntax = "proto3";

package cordum.agent.v1;

option go_package = "github.com/cordum-io/cap/v2/cordum/agent/v1";
option java_package = "io.cordum.cap.agent.v1";
option java_multiple_files = true;
option csharp_namespace = "Cordum.Agent.V1";
option php_namespace = "cordum\\Agent\\V1";
option ruby_package = "Cordum::Agent::V1";

import "google/protobuf/timestamp.proto";
import "cordum/agent/v1/job.proto";
import "cordum/agent/v1/heartbeat.proto";
import "cordum/agent/v1/alert.proto";
import "cordum/agent/v1/handshake.proto";

// BusPacket is the envelope for all traffic on the bus.
message BusPacket {
    string trace_id = 1;                    // correlates related packets
    string sender_id = 2;                   // emitting agent id
    google.protobuf.Timestamp created_at = 3; // emission time
    int32 protocol_version = 4;             // CAP wire version
    SignatureMetadata signature_metadata = 5; // CAP-PRODUCTION signing profile
    IdentityBinding identity = 6;           // mirrors authenticated session identity

    // Reserved for append-only CAP-PRODUCTION envelope payloads. Keeping these
    // out of circulation prevents concurrent protocol work from colliding with
    // the frozen worker-handshake payloads at 19-22.
    reserved 23 to 27;

    oneof payload {
        JobRequest job_request = 10;
        JobResult job_result = 11;
        Heartbeat heartbeat = 12;
        SystemAlert alert = 13;
        JobProgress job_progress = 15;
        JobCancel job_cancel = 16;
        Handshake handshake = 17;
        WorkerHandshakeChallengeRequest worker_handshake_challenge_request = 19;
        WorkerHandshakeChallenge worker_handshake_challenge = 20;
        WorkerHandshakeAuthenticate worker_handshake_authenticate = 21;
        WorkerHandshakeResult worker_handshake_result = 22;
    }
    bytes signature = 14;                   // digital signature of the serialized BusPacket
    string auth_token = 18;                 // trusted runtime session token
}

// SignatureMetadata binds a signature to one profile, packet identity,
// audience, validity window, and locally trusted key identifier.
message SignatureMetadata {
    string profile_version = 1;
    string algorithm = 2;
    bytes message_id = 3; // exactly 16 unpredictable bytes
    string audience = 4;
    google.protobuf.Timestamp expires_at = 5;
    string key_id = 6;
}

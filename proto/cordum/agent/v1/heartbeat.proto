syntax = "proto3";

package cordum.agent.v1;

option go_package = "github.com/cordum-io/cap/v2/cordum/agent/v1";
option java_package = "io.cordum.cap.agent.v1";
option java_multiple_files = true;
option csharp_namespace = "Cordum.Agent.V1";
option php_namespace = "cordum\\Agent\\V1";
option ruby_package = "Cordum::Agent::V1";

// Heartbeat advertises worker liveness and load to schedulers.
message Heartbeat {
    string worker_id = 1;           // unique worker identifier
    string region = 2;              // region/zone/cluster hint
    string type = 3;                // capability class (cpu, gpu, cpu-tools)
    float cpu_load = 4;             // 0-100
    float gpu_utilization = 5;      // 0-100
    int32 active_jobs = 6;          // current in-flight jobs
    repeated string capabilities = 7; // freeform skill descriptors
    reserved 8, 9, 10; // Reserved for future extensions (metrics, resource tracking).
    string pool = 11;               // pool name (often tied to job subject)
    int32 max_parallel_jobs = 12;   // advertised concurrency limit
    map<string, string> labels = 13; // optional placement labels
    float memory_load = 14;         // 0-100
    int32 progress_pct = 15;        // 0-100 task-level progress checkpoint (optional)
    string last_memo = 16;          // last successful internal step/memo (short string/hash)
    string auth_token = 18;         // optional worker attestation credential
    // agent_name is a human-facing DISPLAY label only (e.g. "Claude Code — Billing Bot").
    // It is NOT an authentication authority: consumers MUST prefer authenticated identity
    // records over this self-reported value. Additive/append-only; safe to omit (old clients
    // send empty). See spec/05-heartbeats.md.
    string agent_name = 19;
}

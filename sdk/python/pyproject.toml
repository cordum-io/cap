[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-sdk-python"
version = "2.17.0"
description = "CAP (Cordum Agent Protocol) Python SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Cordum", email = "eng@cordum.io"}]
keywords = ["cap", "cordum", "agent", "protocol", "sdk", "ai"]
classifiers = [
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "protobuf>=6.31.1,<7",
  "grpcio>=1.76.0,<2",
  "nats-py>=2.6.0",
  "cryptography>=41.0.0",
  "pydantic>=2.6.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.8,<2",
  "packaging>=23.2",
  "pdoc>=14.0",
  "PyYAML>=6.0,<7",
  "pytest>=8.0,<9",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=5.0,<7",
]

[project.urls]
Homepage = "https://github.com/cordum-io/cap"
Repository = "https://github.com/cordum-io/cap"
Issues = "https://github.com/cordum-io/cap/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cap", "cap.*"]
namespaces = false

[tool.setuptools.package-data]
cap = ["py.typed"]

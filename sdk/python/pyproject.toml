[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-sdk-python"
version = "2.15.0.dev0"
description = "CAP (Cordum Agent Protocol) Python SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Cordum", email = "eng@cordum.io"}]
keywords = ["cap", "cordum", "agent", "protocol", "sdk", "ai"]
dependencies = [
  "protobuf>=6.31.0,<7.0.0",
  "grpcio>=1.59.0",
  "nats-py>=2.6.0",
  "cryptography>=41.0.0",
  "pydantic>=2.6.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = ["pdoc>=14.0"]

[project.urls]
Homepage = "https://github.com/cordum-io/cap"
Repository = "https://github.com/cordum-io/cap"
Issues = "https://github.com/cordum-io/cap/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*"]

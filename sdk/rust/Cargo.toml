[package]
name = "cap-sdk"
version = "2.5.3"
edition = "2021"
description = "Rust SDK for the Cordum Agent Protocol"
license = "Apache-2.0"

[dependencies]
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
async-nats = "0.37"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
ecdsa = { version = "0.16", features = ["signing", "verifying", "der"] }
thiserror = "2"
tracing = "0.1"
bytes = "1"
futures = "0.3"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
rand_core = { version = "0.6", features = ["std"] }
